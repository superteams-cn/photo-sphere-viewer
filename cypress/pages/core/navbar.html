<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoSphereViewer - 导航栏测试页</title>

    <link rel="stylesheet" href="/dist/core/index.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="photosphere"></div>

    <script type="text/template" id="description">
      <p>这是一段中文说明内容，用于验证说明面板的展示效果。它包含普通文本、链接和高亮内容，便于确认排版在中文场景下依然稳定。</p>
      <p>你可以把这里替换成景点介绍、设备信息、巡检备注或业务说明。默认示例优先使用中文，API 字段名仍保持英文以兼容前端生态。</p>
      <p><a href="https://photo-sphere-viewer.js.org" target="_blank">查看项目文档</a>，继续了解更多配置方式。</p>
    </script>

    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "@photo-sphere-viewer/core": "/dist/core/index.module.js"
        }
      }
    </script>

    <script type="module">
      import { Viewer, DEFAULTS } from '@photo-sphere-viewer/core';
      import { CustomNavbarButton } from '/scripts/CustomNavbarButton.js';

      customElements.define('custom-navbar-button', CustomNavbarButton);

      const baseUrl = 'https://photo-sphere-viewer-data.netlify.app/assets/';

      const viewer = new Viewer({
        container: 'photosphere',
        panorama: baseUrl + 'sphere-small.jpg',
        caption: 'Parc national du Mercantour <b>&copy; Damien Sorel</b>',
        description: document.querySelector('#description').innerHTML,
        lang: {
          myButton: '点我',
        },
        navbar: [
          'zoom',
          'move',
          'download',
          {
            title: 'myButton',
            className: 'custom-button',
            content: '<svg viewBox="0 0 10 10"><circle cx=5 cy=5 r=5 fill=black/></svg>',
            onClick(viewer) {
              alert('自定义按钮已点击');
            },
          },
          {
            title: '其他按钮',
            className: 'custom-button',
            content: '<svg viewBox="0 0 10 10"><rect x=0 y=0 width=10 height=10 fill=black/></svg',
            collapsable: false,
            onClick(viewer) {
              alert('第二个自定义按钮已点击');
            },
          },
          'caption',
          'fullscreen',
        ],
      });

      window.viewer = viewer;
    </script>
  </body>
</html>

    <meta charset="utf-8" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container py-4">
      <header class="pb-3 mb-4 border-bottom d-flex justify-content-between">

          <img src="https://photo-sphere-viewer.js.org/favicon.png" height="32" class="me-2 ms-2" />

        </div>

          <a href="https://photo-sphere-viewer.js.org/" class="fs-5 text-decoration-none"> 文档 </a>
          <a href="https://github.com/mistic100/Photo-Sphere-Viewer" class="me-2 ms-2">

          </a>
        </div>
      </header>

      <div class="row">
        <div class="col-lg-3">
          <div class="card">
            <h5 class="card-header">适配器</h5>
            <div class="list-group list-group-flush">
              <a href="adapter-equirectangular.html" class="list-group-item list-group-item-action">等距柱状图</a>
              <a href="adapter-equirectangular-tiles.html" class="list-group-item list-group-item-action"
                >等距柱状瓦片</a
              >
              <a href="adapter-equirectangular-video.html" class="list-group-item list-group-item-action"
                >等距柱状视频</a
              >
              <a href="adapter-cubemap.html" class="list-group-item list-group-item-action">立方体贴图</a>
              <a href="adapter-cubemap-tiles.html" class="list-group-item list-group-item-action">立方体瓦片</a>
              <a href="adapter-cubemap-video.html" class="list-group-item list-group-item-action">立方体视频</a>
              <a href="adapter-dualfisheye.html" class="list-group-item list-group-item-action">双鱼眼</a>
            </div>
          </div>
        </div>
        <div class="col-lg-3">
          <div class="card">
            <h5 class="card-header">插件</h5>
            <div class="list-group list-group-flush">
              <a href="plugin-autorotate.html" class="list-group-item list-group-item-action">自动旋转</a>
              <a href="plugin-compass.html" class="list-group-item list-group-item-action">指南针</a>
              <a href="plugin-gallery.html" class="list-group-item list-group-item-action">图库</a>
              <a href="plugin-gyroscope-stereo.html" class="list-group-item list-group-item-action">陀螺仪与立体视图</a>
              <a href="plugin-map.html" class="list-group-item list-group-item-action">地图</a>
              <a href="plugin-markers.html" class="list-group-item list-group-item-action">标记</a>
              <a href="plugin-markers-layers.html" class="list-group-item list-group-item-action">标记图层</a>
              <a href="plugin-markers-cubemap.html" class="list-group-item list-group-item-action">标记（立方体）</a>
              <a href="plugin-overlays.html" class="list-group-item list-group-item-action">覆盖层</a>
              <a href="plugin-overlays-cubemap.html" class="list-group-item list-group-item-action">覆盖层（立方体）</a>

            </div>
          </div>
        </div>
        <div class="col-lg-3">
          <div class="card">
            <h5 class="card-header">其他</h5>
            <div class="list-group list-group-flush">
              <a href="misc-components.html" class="list-group-item list-group-item-action">组件</a>

          </div>
        </div>
        <div class="col-lg-3" id="qrcode-container">
          <div class="card">
            <h5 class="card-header">远程调试</h5>
            <div class="card-body">
              <h6 class="card-subtitle mb-2 text-muted">扫码在手机上打开</h6>
              <div id="qrcode"></div>
              <p id="qrcode-label" class="card-text"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "qrcode": "https://esm.run/qrcode"
        }
      }
    </script>

    <script type="module">
      import * as QRCode from 'qrcode';

      const ip = location.hash.replace('#ip=', '');
      if (ip) {
        const addr = `${location.protocol}//${ip}:${location.port}`;

        QRCode.toCanvas(addr, { margin: 0, scale: 8 }, (error, canvas) => {
          document.querySelector('#qrcode').appendChild(canvas);
          document.querySelector('#qrcode-label').innerText = addr;
        });
      } else {
        document.querySelector('#qrcode-container').remove();
      }
    </script>
  </body>
</html>

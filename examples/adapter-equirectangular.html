<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全景图查看器 - 等距柱状图示例</title>

    <link rel="stylesheet" href="/dist/core/index.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="photosphere"></div>

    <script type="text/template" id="description">
      <p>这是一段中文说明内容，用于验证说明面板的展示效果。它包含普通文本、链接和高亮内容，便于确认排版在中文场景下依然稳定。</p>
      <p>你可以把这里替换成景点介绍、设备信息、巡检备注或业务说明。默认示例优先使用中文，API 字段名仍保持英文以兼容前端生态。</p>
      <p><a href="https://photo-sphere-viewer.js.org" target="_blank">查看项目文档</a>，继续了解更多配置方式。</p>
    </script>

    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "@photo-sphere-viewer/core": "/dist/core/index.module.js"
        }
      }
    </script>

    <script type="module">
      import { Viewer, DEFAULTS } from '@photo-sphere-viewer/core';

      const baseUrl = 'https://photo-sphere-viewer-data.netlify.app/assets/';

      const panos = [
        {
          url: baseUrl + 'sphere.jpg',
          caption: '梅康图尔国家公园 <b>&copy; Damien Sorel</b>',
          description: document.querySelector('#description').innerHTML,
        },
        {
          url: baseUrl + 'sphere-test.jpg',
          caption: '测试全景图',
          description: null,
        },
      ];

      const viewer = new Viewer({
        container: 'photosphere',
        panorama: panos[0].url,
        caption: panos[0].caption,
        description: panos[0].description,
        loadingImg: baseUrl + 'loader.gif',
        // minFov: 10,
        // fisheye: true,
        // mousemove: false,
        // mousewheel: false,
        // touchmoveTwoFingers: true,
        // mousewheelCtrlKey: true,
        // moveSpeed: 2,
        // zoomSpeed: 2,
        // moveInertia: false,
        navbar: [
          'zoom',
          'move',
          'download',
          {
            title: '切换图片',
            className: 'custom-button',
            content: '🔄',
            onClick: (() => {
              let i = 0;
              return () => {
                i = 1 - i;
                viewer.setPanorama(panos[i].url, {
                  position: { yaw: 0, pitch: 0 },
                  zoom: 50,
                  caption: panos[i].caption,
                  description: panos[i].description,
                });
              };
            })(),
          },
          {
            title: '随机位置',
            className: 'custom-button',
            content: '🔀',
            onClick: () => {
              viewer.animate({
                yaw: (((Math.random() - 0.5) * 3) / 2) * Math.PI,
                pitch: (((Math.random() - 0.5) * 3) / 4) * Math.PI,
                zoom: Math.random() * 60 + 20,
                speed: 1500,
              });
            },
          },
          'caption',
          'fullscreen',
        ],
        keyboard: 'always',
        keyboardActions: {
          ...DEFAULTS.keyboardActions,
          f: (viewer, e) => viewer.toggleFullscreen(),
          h: (viewer, e) => {
            if (viewer.panel.isVisible('help')) {
              viewer.panel.hide();
            } else {
              viewer.panel.show({
                id: 'help',
                content: '帮助内容',
              });
            }
          },
        },
      });

      viewer.addEventListener('click', ({ data }) => {
        console.log('click', data);
      });

      window.viewer = viewer;
    </script>
  </body>
</html>

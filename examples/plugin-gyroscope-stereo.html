<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全景图查看器 - 陀螺仪与立体视图示例</title>

    <link rel="stylesheet" href="/dist/core/index.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="photosphere"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "@photo-sphere-viewer/core": "/dist/core/index.module.js",
          "@photo-sphere-viewer/gyroscope-plugin": "/dist/gyroscope-plugin/index.module.js",
          "@photo-sphere-viewer/stereo-plugin": "/dist/stereo-plugin/index.module.js"
        }
      }
    </script>

    <script type="module">
      import { Viewer } from '@photo-sphere-viewer/core';
      import { GyroscopePlugin } from '@photo-sphere-viewer/gyroscope-plugin';
      import { StereoPlugin } from '@photo-sphere-viewer/stereo-plugin';

      const baseUrl = 'https://photo-sphere-viewer-data.netlify.app/assets/';

      const viewer = new Viewer({
        container: 'photosphere',
        panorama: baseUrl + 'sphere.jpg',
        caption: '梅康图尔国家公园 <b>&copy; Damien Sorel</b>',
        loadingImg: baseUrl + 'loader.gif',
        plugins: [
          GyroscopePlugin.withConfig({
            // touchmove: false,
            // roll: false,
            // absolutePosition: true,
            // moveMode: 'fast',
          }),
          StereoPlugin,
        ],
      });

      window.viewer = viewer;
    </script>
  </body>
</html>
